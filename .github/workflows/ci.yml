name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
        working-directory: python-service
      - run: pytest -q
        working-directory: python-service

  compose:
    runs-on: ubuntu-latest
    env:
      MYSQL_PASSWORD: ci-mysql-password
      MYSQL_ROOT_PASSWORD: ci-root-password
      JWT_SECRET: dGVzdFNlY3JldEtleUZvckZsb3dGb3JnZUNJRW5kVG9FbmRUZXN0aW5nS2V5
      RABBITMQ_USER: flowforge
      RABBITMQ_PASSWORD: ci-rabbit-password
      RABBITMQ_ERLANG_COOKIE: ci-erlang-cookie-value
      GRAFANA_ADMIN_PASSWORD: ci-grafana-password
      FLOWFORGE_DOMAIN: flowforge.example.com
      TLS_EMAIL: ops@example.com
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
      - run: python ops/generate_env.py --domain flowforge.example.com --email ops@example.com --output generated.env

  end-to-end:
    runs-on: ubuntu-latest
    needs: [backend, frontend, python, compose]
    env:
      JWT_SECRET: dGVzdFNlY3JldEtleUZvckZsb3dGb3JnZUNJRW5kVG9FbmRUZXN0aW5nS2V5
      PLAYWRIGHT_SKIP_WEBSERVER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up --build --wait --wait-timeout 240
      - run: npm run test:e2e
        working-directory: frontend
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs --no-color
      - if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
