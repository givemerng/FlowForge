global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'flowforge-api'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['java-api:8080']

  - job_name: 'flowforge-python'
    static_configs:
      - targets: ['python-service:8000']
